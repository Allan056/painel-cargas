@keyframes cam-passa{from{transform:translateX(-1550px)}to{transform:translateX(1450px)}}
@keyframes via-fluxo{to{background-position:480px 0}}
@keyframes cena-orbita{from{transform:rotateX(66deg) rotateZ(-24deg) scale3d(var(--esc),var(--esc),var(--esc))}to{transform:rotateX(62deg) rotateZ(-15deg) scale3d(var(--esc),var(--esc),var(--esc))}}
@media (max-width:760px){.cena{--esc:.6}.cena .mundo{top:68%}.inicio .ini-txt{padding-top:28px}}
@media (max-width:640px){#login .cena .mundo{top:86%}.barra .lojasel .maismenu{position:fixed;left:12px;right:12px;top:62px;min-width:0}}
/* página inicial: a cena ocupa a tela, o texto fica por cima */
.inicio{position:relative;display:block;align-content:normal;max-width:none;min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px);padding:0;margin:0;overflow:hidden;isolation:isolate}
.inicio .cena{z-index:-1}
.inicio .ini-txt{position:relative;padding:44px clamp(20px,5vw,64px) 0;max-width:640px}
.inicio .ini-data{color:var(--muted)}
/* seletor de loja em lista */
.lojasel .maismenu{min-width:300px;padding:6px;gap:0}
.lojasel .lstit{padding:10px 10px 8px;font:600 12.5px var(--body);color:var(--muted)}
.lojasel .maismenu>button{display:grid;grid-template-columns:20px 1fr auto;gap:10px;min-height:52px;padding:8px 10px;border-radius:8px}
.lojasel .maismenu>button::before{content:"";order:0!important;margin:0!important;width:16px!important;height:16px!important;border-radius:50%;border:2px solid var(--line-forte);background:transparent!important;box-sizing:border-box}
.lojasel .maismenu>button[aria-pressed="true"]::before{border:5px solid var(--accent)}
.lojasel .maismenu>button[aria-pressed="true"]{background:var(--hover)}
.lojasel .ln{display:grid;gap:2px;font-weight:600}.lojasel .ln small{font:500 12.5px var(--body);color:var(--muted)}
.lojasel .maismenu>button>span.qt{font:600 13px var(--body);color:var(--fg);font-variant-numeric:tabular-nums;background:var(--hover);border-radius:6px;padding:3px 8px}
.lojasel .maismenu>button+button{border-top:1px solid var(--line);border-radius:0}
.lojasel .maismenu>button:first-of-type{border-radius:8px 8px 0 0}.lojasel .maismenu>button:last-of-type{border-radius:0 0 8px 8px}
/* seletor discreto na barra: sem fundo azul claro */
.lojasel>summary{background:transparent!important;border:1px solid color-mix(in srgb,var(--barra-fg) 28%,transparent)}
@media (hover:hover) and (pointer:fine){.lojasel>summary:hover{border-color:color-mix(in srgb,var(--barra-fg) 60%,transparent)}}

/* ===================== v6 · perfil, menu do nome e chão sem grade ===================== */

.cena{--chao-luz:rgba(46,92,200,.28);--luz:rgba(255,214,110,.30);--poste:#2a3a6e;--poste-topo:#ffe9a8;--poste-brilho:0 0 18px 6px rgba(255,220,120,.55)}

:root[data-tema="sol"] .cena.dia{--chao-luz:rgba(255,253,246,.95);--luz:rgba(232,89,42,.06);--poste:#d8cdb8;--poste-topo:#e8592a;--poste-brilho:none}
.cena .cx{top:calc(var(--y,0)*1px)}

.cena .luz{left:calc(var(--px)*1px - 110px);top:calc(var(--py)*1px - 110px);width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,var(--luz),transparent);transform:translateZ(1.5px)}
.cena .cam .cx{top:0}
/* menu do nome */
.maismenu>a.mlink{box-sizing:border-box;display:flex;align-items:center;min-height:40px;padding:8px 10px;border-radius:7px;font:600 14px var(--body);color:var(--fg);text-decoration:none}

.maismenu>a.mlink:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* meu perfil */
.perfilp{display:grid;gap:14px;max-width:760px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:grid;gap:12px}
.pcard h2{font:700 17px var(--display);margin:0}
.pcard .small{margin:0}
.pcab{grid-template-columns:auto 1fr;align-items:center;gap:16px}
.pcab h2{font-size:22px}
.pav{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--destaque);color:var(--destaque-fg);font:700 20px var(--display)}
.pdl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin:0}
.pdl dt{font-size:12.5px;color:var(--muted)} .pdl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.temas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;padding:8px;border:1px solid var(--line-forte);border-radius:10px;background:var(--surface)}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.tcard:hover{border-color:var(--accent)}}
.tnome{font:600 14px var(--body);padding:0 4px 2px;display:flex;align-items:center;gap:8px}
.tcard[aria-pressed="true"] .tnome::after{content:"em uso";font:500 12px var(--body);color:var(--muted)}
.tprev{display:grid;grid-template-rows:14px 1fr;gap:6px;height:76px;border-radius:7px;padding:0 0 8px;overflow:hidden;position:relative}
.tprev i{display:block}.tprev b{display:block;margin:0 10px;border-radius:4px;height:16px}
.tprev b+b{width:60%;height:10px}
.tp-claro{background:#f4f5f8}.tp-claro i{background:#0f1c42}.tp-claro b{background:#fff;box-shadow:0 0 0 1px #e2e4ec}.tp-claro b+b{background:#16336f}
.tp-sol{background:#f8f5ef}.tp-sol i{background:#0a2a63}.tp-sol b{background:#fffdf9;box-shadow:0 0 0 1px #e9e2d5}.tp-sol b+b{background:#e8592a}
.tp-escuro{background:#0e1230}.tp-escuro i{background:#0a0d26}.tp-escuro b{background:#161b40;box-shadow:0 0 0 1px #272d5a}.tp-escuro b+b{background:#ffe600}
.pbts{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:640px){.pdl,.temas{grid-template-columns:1fr 1fr}.pcard{padding:16px}}

/* ===================== v6 · resumo ===================== */
.resumo{display:grid;gap:26px;margin-top:12px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcard{display:grid;gap:4px;align-content:start;padding:16px 18px 15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;position:relative;transition:border-color .15s ease,transform .16s var(--ease-out)}
.rcard::before{content:"";position:absolute;left:18px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--line-forte)}
.rcard.s1::before{background:var(--s1)}.rcard.s2::before{background:var(--s2)}.rcard.s3::before{background:var(--s3)}.rcard.s4::before{background:var(--s4)}.rcard.s5::before{background:var(--s5)}
.rcard.dest::before{background:var(--destaque);width:44px}.rcard.crit::before{background:var(--crit)}.rcard.warn::before{background:var(--warn)}.rcard.ok::before{background:var(--ok)}
.rcard.crit .rn{color:var(--crit)}
.rt{font:600 13.5px var(--body);color:var(--muted);margin-top:4px}
.rn{font:700 34px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rs{font-size:13.5px;color:var(--fg)}
.rx{font-size:12.5px;color:var(--muted)} .rx.crit{color:var(--crit);font-weight:600}

.rcard:active{transform:scale(.98)}
.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rsh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}.rsh h2{font:700 19px var(--display);margin:0}
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}

/* ===================== v13 · correções da revisão ===================== */
/* animações mais leves */
.conteudo{transition:none!important}
.inicio .palco3d,.inicio .ini-txt{transition:opacity .24s ease!important}
body.menu-on .inicio .palco3d{filter:none!important;opacity:.22!important}

/* janela da carga desliza */
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:gav-entra .28s cubic-bezier(.32,.72,0,1)}
  @media (max-width:640px){.drawer{animation-name:gav-sobe}}
}
@keyframes gav-entra{from{transform:translateX(100%)}}
@keyframes gav-sobe{from{transform:translateY(100%)}}
.drawer,.menu,.maismenu,#janela,.modal{overscroll-behavior:contain}
/* toque */
html{touch-action:manipulation}
button,a,summary,label{-webkit-tap-highlight-color:transparent}
/* pular para o conteúdo */
.pular{all:unset;position:fixed;left:12px;top:-60px;z-index:200;background:var(--destaque);color:var(--destaque-fg);font:600 14px var(--body);padding:10px 14px;border-radius:8px}
.pular:focus-visible{top:10px;outline:2px solid var(--fg);outline-offset:2px}

.tcard{transition:border-color .15s ease,transform .16s var(--ease-out)}.tcard:active{transform:scale(.97)}
.vsenha{transition:background-color .15s ease,transform .12s var(--ease-out)}.vsenha:active{transform:translateY(-50%) scale(.92)}
/* símbolos trocados */
.ocm{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--high)}
.ico-al{display:block}
.xlimpa{margin-left:6px;font-size:16px;line-height:1;opacity:.75}

.hero.h2{border-left-width:1px!important;border-left-color:var(--line)!important}
.hero.h2 .hagl{margin-top:10px}
.etq{display:inline-block;margin-left:8px;font:600 12px var(--body);padding:2px 8px;border-radius:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.etq.crit{background:var(--crit-bg);color:var(--crit)}.etq.warn{background:var(--warn-bg);color:var(--warn)}
/* pessoas online em texto normal */
.presenca .on{font:500 12.5px var(--body)!important;letter-spacing:0!important;text-transform:none!important;color:var(--muted)!important}
/* aviso de desfazer */
#desfazer{position:fixed;left:50%;bottom:20px;z-index:120;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 24px);box-sizing:border-box;padding:8px 8px 8px 16px;border-radius:10px;background:#151a33;color:#eef1fb;box-shadow:0 12px 32px rgba(0,0,0,.35);font:500 14px var(--body);transform:translate(-50%,calc(100% + 32px));opacity:0;visibility:hidden;transition:transform .24s var(--ease-out),opacity .2s ease,visibility 0s .24s}
#desfazer.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .24s var(--ease-out),opacity .2s ease,visibility 0s}

@media (prefers-reduced-motion:reduce){#desfazer,#desfazer.on{transition:opacity .2s ease,visibility 0s}}

  if(n.includes("PRODUZID")||n.includes("AGUARDANDOEXPED")||n.includes("AGUARDANDOCOLETA")) return 4;
  if(n.includes("EMPRODU")) return 3;
  if(n.includes("PROXIMA")||n.includes("NOCRONOGRAMA")||n.includes("PROGRAMAD")||n.includes("AGUARDANDOPRODU")) return 2;
  if(n.includes("AGUARDANDOCRON")||n.includes("ROTEIRIZAD")||n.includes("ROTERIZAD")) return 1;

/* ================= cálculo de cada carga ================= */
function calc(id,d,hoje){
  const cod=typeof d.status==="number"?d.status:1, ag=dayOf(d.agenda);
  /* agenda na terça (regra da terça): cronograma até o sábado da produção. O R.F. não tem prazo: pode ser informado em qualquer dia antes do cronograma. */
  const terca=!!(cfg.regraTerca&&ag!=null&&new Date(ag*864e5).getUTCDay()===2);
  let lim=null;
  if(ag!=null){ lim=terca?ag-3:menosUteis(ag,cfg.regraDias); }
  const duLim=lim==null?null:uteisEntre(hoje,lim)+(lim>hoje&&!util(lim)?1:0);
  const rfInfo=d.rfInfo&&d.rfInfo.em?d.rfInfo:null;
  const rfDia=rfDiaDe(rfInfo); /* dia em que o R.F. foi informado */
  const duAg=ag==null?null:uteisEntre(hoje,ag);
  const ex=ag==null?null:ag-1; /* expedição: véspera da agenda (entrega na madrugada do dia agendado) */
  let alerta="No prazo",nivel="ok",acao="";
  if(cod===6||cod===0){alerta="Encerrada";nivel="none";}
  else if(ag==null){alerta="Sem agenda";nivel="high";acao="Agendar no portal ML";}
  else if(cod===5){if(hoje>=ag){alerta="Confirmar entrega";nivel="warn";acao="Confirmar recebimento na loja";}else acao="Acompanhar entrega";}
  else if(cod>1&&hoje>ex){alerta="Expedição atrasada";nivel="crit";acao="Expedir / reagendar no portal ML";}
  else if(cod===1&&hoje>ag){alerta="Entrega atrasada";nivel="crit";acao="Reagendar no portal ML";}
  else if(cod===1){
    acao=rfInfo?"Confirmar a inclusão no cronograma":"Informar R.F. e incluir no cronograma";
    if(hoje>lim){alerta="Fora do prazo do cronograma";nivel="crit";}
    else if(hoje===lim){alerta="Incluir hoje";nivel="high";if(!rfInfo)acao="Informar R.F. e incluir hoje";}
    else if(rfInfo){alerta="R.F. informado";nivel="ok";}
    else if(duLim<=cfg.atencaoDias){alerta="Atenção";nivel="warn";}
  }
  else if(hoje===ex){alerta="Expedir hoje";nivel="high";acao=cod===4?"Expedir hoje":"Finalizar produção e expedir hoje";}
  else if(cod<=3&&uteisEntre(hoje,ex)<=1){alerta="Risco de atraso";nivel="high";acao=cod===2?"Iniciar produção":"Finalizar produção";}
  else{acao={2:"Produzir",3:"Acompanhar produção",4:"Expedir em "+br(isoOf(ex))}[cod]||"";}
  const rank={crit:0,high:1,warn:2,ok:3,none:9}[nivel];
  const ref=cod===1?lim:ag;
  const hist=Array.isArray(d.hist)?d.hist:[];
  return {id,envio:String(d.envio||""),carga:String(d.carga||""),galpao:String(d.galpao||""),loja:String(d.loja==null?"":d.loja),rot:d.rot||"",agenda:d.agenda||"",volume:(typeof d.volume==="number"?d.volume:null),obs:d.obs||"",
    pbr:(typeof d.pbr==="number"?d.pbr:null),chep:(typeof d.chep==="number"?d.chep:null),rfInfo,terca,motivo:d.motivoAtraso&&d.motivoAtraso.motivo?d.motivoAtraso:null,unid:typeof d.unidades==="number"?d.unidades:null,itens:d.itens&&Array.isArray(d.itens.lista)?d.itens:null,
    cod,hist,atualizadoEm:d.atualizadoEm||"",atualizadoPor:d.atualizadoPor||null,
    lim:lim==null?"":isoOf(lim),duLim,exp:ex==null?"":isoOf(ex),rf:rfDia,duAg,alerta,nivel,acao,key:rank*1e6+(ref==null?99999:ref)};
}

function rfDiaDe(x){ if(!x||!x.em) return ""; if(x.dia&&/^\d{4}-\d{2}-\d{2}$/.test(x.dia)) return x.dia; const d=new Date(x.em); return isNaN(d)?String(x.em).slice(0,10):iso(d.getFullYear(),d.getMonth()+1,d.getDate()); }

function storeLocal(){
  let data={}; try{data=JSON.parse(localStorage.getItem(KEY_DADOS)||"{}")||{};}catch(_){armazenamentoOk=false;}
  const subsC={}, subsD={}; let pend=new Set(), tEmit=null, tSave=null;
  const colOf=p=>p.slice(0,p.lastIndexOf("/"));
  const save=()=>{clearTimeout(tSave);tSave=setTimeout(()=>{try{localStorage.setItem(KEY_DADOS,JSON.stringify(data));armazenamentoOk=true;}catch(_){armazenamentoOk=false;render();}},50);};
  const snapDoc=p=>({id:p.split("/").pop(),exists:Object.prototype.hasOwnProperty.call(data,p),data:()=>data[p],metadata:{fromCache:false,hasPendingWrites:false}});
  const qs=c=>({docs:Object.keys(data).filter(p=>colOf(p)===c).sort().map(snapDoc),metadata:{fromCache:false,hasPendingWrites:false}});

    cols.forEach(c=>(subsC[c]||[]).forEach(f=>f(qs(c))));ps.forEach(x=>(subsD[x]||[]).forEach(f=>f(snapDoc(x))));},0);};
  const clone=d=>JSON.parse(JSON.stringify(d));

    get:async()=>snapDoc(p),
    set:async d=>{data[p]=clone(d);save();emit(p);},
    update:async d=>{if(!(p in data))throw {code:"invalid_argument"};data[p]={...data[p],...clone(d)};save();emit(p);},
    delete:async()=>{delete data[p];save();emit(p);},
    onSnapshot:fn=>{(subsD[p]=subsD[p]||[]).push(fn);setTimeout(()=>fn(snapDoc(p)));return ()=>{};}});
  return {doc:docRef,collection:c=>({path:c,doc:id=>docRef(c+"/"+id),onSnapshot:fn=>{(subsC[c]=subsC[c]||[]).push(fn);setTimeout(()=>fn(qs(c)));return ()=>{};}})};
}

/* ---------- Modo TV: tela cheia, alterna Resumo e Agendadas a cada 30 s ---------- */
const TV_SEG=30, TV_TELAS=[["resumo","Resumo"],["agendadas","Agendadas"]];
let tvPag=0, tvIni=0, tvT=null, tvPausa=false, tvVolta="resumo", tvFs=false, tvPausaEm=0;
function tvControle(v){
  if(v==="tv"){ if(!tvT){tvIni=Date.now();tvPausa=false;tvT=setInterval(tvTick,1000);} }
  else if(tvT){clearInterval(tvT);tvT=null; if(document.fullscreenElement&&tvFs){tvFs=false;try{document.exitFullscreen();}catch(_){}}}
}
function tvTick(){
  const h=document.querySelector(".tvhora"); if(h) h.textContent=horaAgora();
  if(tvPausa||document.hidden||openId||$("#txtcopia")) {if(!tvPausa) tvIni+=1000; return;}
  if(Date.now()-tvIni>=TV_SEG*1000){tvPag=(tvPag+1)%TV_TELAS.length;tvIni=Date.now();render();window.scrollTo(0,0);}
}
function tvTelaCheia(){const el=document.documentElement; if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen().then(()=>{tvFs=true;}).catch(()=>{});}}
function sairTV(){ location.hash="#"+tvVolta; }
function vTV(pal){
  const [k,nome]=TV_TELAS[tvPag], dec=Math.min(TV_SEG*1000,Date.now()-tvIni);
  return `<div class="tvbar" role="region" aria-label="Controles do modo TV">
      <span class="tvlogo" aria-hidden="true">${LOGO}</span><b class="tvtit">${nome}</b><span class="tvloja">${lojaF?"Loja "+esc(lojaF):"Todas as lojas"} · ${wd(hojeN())} ${br(hojeIso())} · <span class="tvhora">${horaAgora()}</span></span>
      <span class="tvdots" aria-label="Tela ${tvPag+1} de ${TV_TELAS.length}">${TV_TELAS.map((_,i)=>`<i class="${i===tvPag?"on":""}"></i>`).join("")}</span>
      <span style="flex:1"></span>
      <button class="btn ghost sm" data-tv="pausa" aria-pressed="${tvPausa}">${tvPausa?"Continuar":"Pausar"}</button>
      <button class="btn ghost sm" data-tv="prox">Próxima tela</button>
      <button class="btn ghost sm" data-tv="cheia">Tela cheia</button>
      <button class="btn sm tvsair" data-tv="sair">Sair (Esc)</button>
      <span class="tvprog ${tvPausa?"pausa":""}" aria-hidden="true"><i style="animation-duration:${TV_SEG}s;animation-delay:-${dec}ms"></i></span>
    </div>
    <div class="tvcorpo" data-tvtela="${k}">${k==="resumo"?vResumo(pal):vAgendadas()}</div>`;
}
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement&&tvFs){tvFs=false; if(view()==="tv") sairTV();} });

document.addEventListener("visibilitychange",()=>document.documentElement.classList.toggle("pausa",document.hidden));
let holoRodando=false;const holoT0=performance.now();let holoMx=null,holoMy=.5,holoRz=-24,holoRx=63;
addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){holoMx=e.clientX/innerWidth;holoMy=e.clientY/innerHeight;}},{passive:true});
function holoInicia(){if(holoRodando||matchMedia("(prefers-reduced-motion: reduce)").matches)return;holoRodando=true;requestAnimationFrame(holoQuadro);}
function holoQuadro(now){
  const el=document.querySelector(".palco3d"); if(!el){holoRodando=false;return;}
  const t=(now-holoT0)/1000;
  /* com mouse o caminhão acompanha o ponteiro; sem mouse (celular) gira devagar sozinho */
  /* mouse de uma ponta à outra da tela = uma volta completa (360°); com o menu aberto o caminhão fica parado */
  if(!menuAberto){
    const alvoRz=holoMx!=null?-24+(holoMx-.5)*360:-24+t*14, alvoRx=holoMx!=null?63-(holoMy-.5)*18:63+3*Math.sin(t/18*2*Math.PI);
    holoRz+=(alvoRz-holoRz)*.08; holoRx+=(alvoRx-holoRx)*.08;
  }
  const mu=el.querySelector(".mundo3"); if(mu) mu.style.transform=`rotateX(${holoRx.toFixed(2)}deg) rotateZ(${holoRz.toFixed(2)}deg) scale3d(var(--esc3,.9),var(--esc3,.9),var(--esc3,.9))`;
  requestAnimationFrame(holoQuadro);
}

function marcos(r){ // primeira data observada (não inicial) em que a carga chegou a cada status, e entrada no cronograma
  const m={}; let entrada=null;
  r.hist.filter(h=>h&&h.tipo==="status"&&h.de!=null&&h.em).sort((a,b)=>(a.em+(a.reg||"")).localeCompare(b.em+(b.reg||""))).forEach(h=>{
    if(m[h.para]==null) m[h.para]=h.em;
    if(entrada==null&&h.de===1&&h.para>=2&&h.para<=6) entrada=h.em;
  });
  return {m,entrada};
}
function media(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;}
const fmt1=(x)=>x==null?"—":x.toLocaleString("pt-BR",{maximumFractionDigits:1});
const pct=(a,b)=>b?Math.round(100*a/b):null;
function kpiCalc(list){

  let crOk=0,crLate=0,crPend=0,enOk=0,enLate=0,enPend=0; const antec=[],tProd=[],tCron=[],tExp=[],tTr=[],lateList=[];
  list.forEach(r=>{
    if(r.cod===0) return;
    const {m,entrada}=marcos(r); const lim=dayOf(r.lim), ag=dayOf(r.agenda);
    if(entrada&&lim!=null){ if(dayOf(entrada)<=lim) crOk++; else {crLate++;lateList.push({r,tipo:"Cronograma",data:entrada,atraso:uteisEntre(lim,dayOf(entrada))});} if(ag!=null) antec.push(uteisEntre(dayOf(entrada),ag)); }
    else if(r.cod===1&&lim!=null&&hoje>lim){crPend++;}
    if(m[6]&&ag!=null){ if(dayOf(m[6])<=ag) enOk++; else {enLate++;lateList.push({r,tipo:"Entrega",data:m[6],atraso:uteisEntre(ag,dayOf(m[6]))});} }
    else if(aberta(r)&&ag!=null&&hoje>ag){enPend++;}
    const du=(a,b)=>m[a]&&m[b]?uteisEntre(dayOf(m[a]),dayOf(m[b])):null;
    const x1=du(2,3),x2=du(3,4),x3=du(4,5),x4=du(5,6);
    if(x1!=null)tCron.push(x1); if(x2!=null)tProd.push(x2); if(x3!=null)tExp.push(x3); if(x4!=null)tTr.push(x4);
  });
  return {crOk,crLate,crPend,enOk,enLate,enPend,antec:media(antec),nAntec:antec.length,tCron:media(tCron),tProd:media(tProd),tExp:media(tExp),tTr:media(tTr),nT:[tCron.length,tProd.length,tExp.length,tTr.length],lateList};
}
/* OTIF de expedição: entregue, expedida até a véspera da agenda e sem ocorrência registrada */

  list.forEach(r=>{ if(r.cod!==6||!r.exp) return; const {m}=marcos(r); if(!m[5]){semExp++;return;} n++; if(m[5]<=r.exp&&!(oc&&oc(r.carga).length)) ok++; });

function motivosCalc(list){ const c=new Map(); list.forEach(r=>{if(r.cod===0||!r.motivo) return; c.set(r.motivo.motivo,(c.get(r.motivo.motivo)||0)+1);});

function pbConf(r,v){

  return {dif:soma-r.volume,soma,ok:v.corte&&soma<r.volume};

/* ================= importação com conferência ================= */
function toISO(v){
  if(v==null||v==="") return "";
  /* data do Excel: pode vir à meia-noite (às vezes com segundos a mais ou a menos) ou ao meio-dia (planilha baixada do painel e salva no Excel). Somar 6 h acerta o dia nos dois casos. */
  if(v instanceof Date){const d=new Date(v.getTime()+6*36e5);return iso(d.getFullYear(),d.getMonth()+1,d.getDate());}
  if(typeof v==="number"){const p=XLSX.SSF.parse_date_code(v);return p?iso(p.y,p.m,p.d):"";}
  const s=String(v).trim(); let m;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?$/)){let y=+m[3];if(y<100)y+=2000;return iso(y,+m[2],+m[1]);}
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return iso(+m[1],+m[2],+m[3]);
  return "?";
}

/* Status das ordens no Infor WMS → status do painel */
const WMS_ST={"00":["Vazia",1],"02":["Criada (integração)",1],"04":["Criada internamente",1],"06":["Não iniciada",1],"08":["Convertida",1],"09":["Não iniciada",1],

  "22":["Parcialmente liberada",null],"25":["Liberada / separada parcial",3],"29":["Liberada",null],

  "96":["Entregue",6],"98":["Cancelada externamente",0],"99":["Cancelada internamente",0]};
const WMS_COLS={ORDERKEY:"Nº da ordem (carga)",TOTALQTY:"Qtd. total (unidades)",TOTALORDERLINES:"Total de linhas de ordem",ORDERDATE:"Data da ordem (roteirização)",EXT_UDF_LKUP1:"Lista de códigos CDU 1 (galpão)",CONSIGNEEKEY:"Receptor (loja destino)",TOTALPALLETESTIMATE:"Estimativa de palete total",STATUS:"Status",ACTUALSHIPDATE:"Data real de expedição",EDITDATE:"Data da atualização"};
/* Números do WMS: vêm como TEXTO no padrão americano (7,212.00000 = 7.212; 3,000 = 3.000).
   Se alguém abrir e salvar no Excel em português podem virar 7.212,00000. A convenção é decidida pelo arquivo inteiro,
   olhando só os valores sem ambiguidade (com os dois separadores, ou com casas decimais diferentes de 3). */
function convNum(tabelas){
  let us=0,brn=0;
  tabelas.forEach(a=>a.forEach(row=>row.forEach(v=>{ if(typeof v!=="string") return; const t=v.replace(/\u00a0/g,"").trim(); if(!t) return;
    if(/^-?\d{1,3}(,\d{3})+\.\d+$/.test(t)||/^-?\d+\.(\d{1,2}|\d{4,})$/.test(t)) us++;
    else if(/^-?\d{1,3}(\.\d{3})+,\d+$/.test(t)||/^-?\d+,(\d{1,2}|\d{4,})$/.test(t)) brn++; })));
  if(us&&brn) return {conv:us>=brn*20?"us":brn>=us*20?"br":"misto",us,br:brn};
  return {conv:brn?"br":"us",us,br:brn};
}
function numeroWMS(v,conv){
  if(v===""||v==null) return null;
  if(typeof v==="number") return Number.isFinite(v)?v:NaN;
  if(v instanceof Date) return NaN;
  let t=String(v).replace(/[\u00a0\s]/g,""); if(!t) return null;
  if(conv==="br"){ if(!/^-?[\d.]*,?\d*$/.test(t)) return NaN; t=t.replace(/\./g,"").replace(",","."); }
  else { if(!/^-?[\d,]*\.?\d*$/.test(t)) return NaN; t=t.replace(/,/g,""); }
  const n=Number(t); return t===""||t==="-"||!Number.isFinite(n)?NaN:n;
}
const palInt=n=>n==null?null:Math.ceil(n-1e-6); // palete não se fraciona: 0,78 → 1
function lerWMS(nome,a,hi,conv,erros){
  const h=a[hi].map(c=>String(c||"").trim().toUpperCase()); const c=k=>h.indexOf(k);
  const ci={carga:c("ORDERKEY"),rot:c("ORDERDATE"),galpao:c("EXT_UDF_LKUP1"),loja:c("CONSIGNEEKEY"),pal:c("TOTALPALLETESTIMATE"),st:c("STATUS"),exp:c("ACTUALSHIPDATE"),edit:c("EDITDATE"),unid:c("TOTALQTY"),nlin:c("TOTALORDERLINES")};
  const numero=(v,car,col)=>{const n=numeroWMS(v,conv); if(Number.isNaN(n)){erros.push(`Carga ${car}: "${String(v)}" em ${col} não é um número.`);return null;} return n;};
  const linhas=[];
  a.slice(hi+1).forEach((row,i)=>{
    const car=String(row[ci.carga]??"").trim(); if(!car||/^(MESSAGES|N.º DA ORDEM|Nº DA ORDEM)/i.test(String(row[0]||"")+car)) return;
    if(!/^\d+$/.test(car)) return;

    const rot=toISO(g("rot")), exp=toISO(g("exp")), edit=toISO(g("edit"));
    const loja=String(g("loja")??"").trim();
    const un=numero(g("unid"),car,"Qtd. total");
    if(un!=null&&(un<0||Math.abs(un-Math.round(un))>1e-6)) erros.push(`Carga ${car}: Qtd. total ${String(g("unid"))} não é um número inteiro de unidades.`);
    linhas.push({linha:hi+i+2,carga:car,rot:rot==="?"?"":rot,galpao:String(g("galpao")||"").trim(),loja,volume:palInt(numero(g("pal"),car,"Estimativa de palete total")),wms:st,exp:exp==="?"?"":exp,edit:edit==="?"?"":edit,
      unid:un==null?null:Math.round(un),nlin:ci.nlin<0?null:numero(g("nlin"),car,"Total de linhas")});
  });

}
/* aba Detail: um item (SKU) por linha */
function lerDetalhe(nome,a,hi,conv,erros){
  const h=a[hi].map(c=>String(c||"").trim().toUpperCase()); const c=k=>h.indexOf(k);
  const ci={carga:c("ORDERKEY"),sku:c("SKU"),lin:c("ORDERLINENUMBER"),ped:c("ORIGINALQTY"),aj:c("ADJUSTEDQTY"),pal:c("PALLETESTIMATE")};
  const m=new Map();
  a.slice(hi+1).forEach(row=>{
    const car=String(row[ci.carga]??"").trim(); if(!/^\d+$/.test(car)) return;
    const sku=String(row[ci.sku]??"").replace(/[\u00a0\s]/g,""); if(!sku) return;
    const num=(k,col)=>{if(ci[k]<0) return 0; const n=numeroWMS(row[ci[k]],conv); if(Number.isNaN(n)){erros.push(`Carga ${car}, item ${sku}: "${String(row[ci[k]])}" em ${col} não é um número.`);return 0;} return n||0;};
    const ped=num("ped","Qtd. ord."), aj=num("aj","Qtd. ajustada"), p=num("pal","Estimativa de palete");
    if(Math.abs(ped-Math.round(ped))>1e-6||Math.abs(aj-Math.round(aj))>1e-6) erros.push(`Carga ${car}, item ${sku}: quantidade com fração (${ped}).`);
    if(!m.has(car)) m.set(car,[]);

/* base de SKUs (código e descrição) */
function lerSkus(nome,a,hi){

    const l={sku,desc,linha:hi+i+2}; vis.set(sku,l); linhas.push(l);

function areaReal(ws){ // alguns sistemas (ex.: WMS) declaram a área da planilha menor do que ela é
  let r0=1e9,c0=1e9,r1=-1,c1=-1;
  Object.keys(ws).forEach(k=>{if(k[0]==="!")return;const a=XLSX.utils.decode_cell(k);if(a.r<r0)r0=a.r;if(a.c<c0)c0=a.c;if(a.r>r1)r1=a.r;if(a.c>c1)c1=a.c;});
  if(r1>=0) ws["!ref"]=XLSX.utils.encode_range({s:{r:Math.min(r0,0),c:Math.min(c0,0)},e:{r:r1,c:c1}});
}
function lerPlanilha(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});

    if(hw>=0){

        const hd=b.slice(0,20).findIndex(row=>{const u=row.map(c=>String(c).trim().toUpperCase());return u.includes("ORDERKEY")&&u.includes("SKU")&&u.includes("ORIGINALQTY");});

          if(l.nlin!=null&&it.length!==l.nlin) avisos.push(`Carga ${l.carga}: ${it.length} itens na aba ${d.aba}, mas o WMS diz ${l.nlin} linhas.`);

    }

    if(hi<0) continue;
    const h=a[hi].map(norm), col=(...ks)=>h.findIndex(x=>ks.some(k=>x.includes(k)));
    const ci={envio:h.indexOf("ENVIO"),carga:h.findIndex(x=>x.startsWith("CARGA")),galpao:col("GALPAO","GALPOES"),loja:col("LOJA"),rot:col("ROTERIZ","ROTEIRIZ"),agenda:h.findIndex(x=>x.includes("AGENDA")&&!x.includes("CRONOGRAMA")),status:col("STATUS"),obs:col("OBS"),
      volume:h.findIndex(x=>(x.includes("PALETE")||x.includes("VOLUME"))&&!x.includes("PBR")&&!x.includes("CHEP")),pbr:col("PBR"),chep:col("CHEP"),rf:col("RFINFORMADO")};
    const linhas=[];

      const g=k=>ci[k]<0?"":row[ci[k]];
      const vr=g("volume"); const vol=vr===""||vr==null?null:Number(String(vr).replace(",","."));
      const inteiro=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return Number.isFinite(n)&&n>=0?Math.round(n):null;};
      const rfv=g("rf"); const rfIso=rfv instanceof Date?new Date(rfv.getTime()).toISOString():rfv!==""&&rfv!=null?(()=>{const d=toISO(rfv);return d&&d!=="?"?d+"T12:00:00.000Z":null;})():null;
      const base={linha:hi+i+2,envio:String(env??"").trim(),galpao:String(g("galpao")||"").trim(),loja:String(g("loja")??"").trim(),rot:toISO(g("rot")),agenda:toISO(g("agenda")),statusTxt:String(g("status")||"").trim(),obs:String(g("obs")||"").trim(),volume:vol,volRaw:vr,pbr:inteiro(g("pbr")),chep:inteiro(g("chep")),rf:rfIso};

function lerHist(wb){

function prever(arquivo,lp){
  const hoje=hojeN(); const probs=[]; const seen=new Map(); const novas=[], mud=[], atras=[], iguais=[];
  const P=(sev,l,t)=>probs.push({sev,linha:l.linha,carga:l.carga,t});
  lp.linhas.forEach(l=>{
    if(!l.carga){P("e",l,"Linha sem número de carga (ignorada).");return;}
    const id=idPorCarga().get(l.carga)||docId(l.envio,l.carga);
    if(seen.has(id)){P("e",l,`Carga repetida (já na linha ${seen.get(id)}); esta linha foi ignorada.`);return;}
    seen.set(id,l.linha);
    if(!/^\d{8}$/.test(l.carga)) P("w",l,`Número de carga fora do padrão de 8 dígitos (${l.carga}).`);
    if(l.envio&&!/^\d{8}$/.test(l.envio)) P("w",l,`Número de envio fora do padrão de 8 dígitos (${l.envio}).`);
    if(l.agenda==="?"){P("e",l,"Data de agenda inválida (ficou em branco).");l.agenda="";}
    if(l.rot==="?"){P("w",l,"Data de roteirização inválida (ficou em branco).");l.rot="";}
    if(!l.agenda) P("w",l,"Sem envio/agenda ainda: o cronograma é calculado depois de agendar.");
    if(l.agenda&&l.rot&&l.agenda<l.rot) P("e",l,"Agenda antes da roteirização.");
    if(lp.temGalpao&&!l.galpao) P("w",l,"Galpão em branco.");
    if(lp.temLoja&&!l.loja) P("w",l,"Loja destino em branco.");
    if(l.volume!=null&&isNaN(l.volume)){P("w",l,`Volume não numérico (${l.volRaw}); ignorado.`);l.volume=null;}
    let sc=codTexto(l.statusTxt);
    if(sc===undefined){P("w",l,`Status "${l.statusTxt}" não reconhecido; status atual mantido.`);sc=null;}
    const ex0=docs.get(id); const hp=lp.hist&&lp.hist.get(l.carga);
    const ex=ex0&&modoLocal&&hp?{...ex0,hist:hp,status:ultimoStatus(hp)??ex0.status}:ex0;
    const histMudou=!!(ex0&&modoLocal&&hp&&JSON.stringify(hp)!==JSON.stringify(ex0.hist||[]));
    const ag=dayOf(l.agenda); const stFinal=sc!=null?sc:(ex?ex.status:(hp?ultimoStatus(hp)??1:1));
    if(ag!=null&&hoje>ag&&stFinal>=1&&stFinal<=5) P("w",l,`Agenda ${br(l.agenda)} já passou e a carga não está como Entregue.`);
    if(!ex){ const bh=hp||[]; novas.push({id,l,status:sc!=null?sc:(ultimoStatus(bh)??1),baseHist:bh}); return; }
    /* opção B: nas cargas que vêm do relatório do WMS, galpão, loja, roteirização, paletes e status de produção são do WMS */
    const doWms=!!(ex.itens||(ex.hist||[]).some(h=>h.origem==="wms")); const NOME={galpao:"Galpão",loja:"Loja",rot:"Roteirização"};
    const camp={}; [["envio",l.envio],["galpao",l.galpao],["loja",l.loja],["rot",l.rot],["agenda",l.agenda],["obs",l.obs]].forEach(([k,v])=>{ if((k==="envio"||k==="agenda")&&!v) return; if(k==="galpao"&&!lp.temGalpao) return; if(k==="loja"&&!lp.temLoja) return;
      if(String(v||"")!==String(ex[k]||"")){ if(doWms&&NOME[k]){ if(v) P("w",l,`${NOME[k]} na base: ${k==="rot"?br(v):v}; no WMS: ${k==="rot"?br(ex[k]):ex[k]||"vazio"}. Fica o do WMS.`); return; } camp[k]=v; } });
    if(lp.temVolume){const ov=typeof ex.volume==="number"?ex.volume:null; if(l.volume!==ov){ if(doWms){ if(l.volume!=null) P("w",l,`Paletes na base: ${l.volume}; no WMS: ${ov??"vazio"}. Fica o do WMS.`); } else camp.volume=l.volume; }}
    if(lp.temPbr){ const np=l.pbr, nc=l.chep, vol=typeof ex.volume==="number"?ex.volume:null;
      if(doWms&&(np!=null||nc!=null)&&vol!=null&&(np||0)+(nc||0)!==vol&&!palReal(ex)) P("w",l,`PBR ${np??0} + CHEP ${nc??0} não fecha com os ${vol} paletes do WMS: PBR e CHEP não foram alterados.`);
      else ["pbr","chep"].forEach(k=>{const ov=typeof ex[k]==="number"?ex[k]:null; if(l[k]!==ov&&!(l[k]==null&&!modoLocal)) camp[k]=l[k];});}
    if(lp.temRf&&l.rf){const nd=rfDiaDe({em:l.rf});
      if(!(ex.rfInfo&&ex.rfInfo.em)){ if((typeof ex.status==="number"?ex.status:1)===1) camp.rfInfo={em:l.rf,dia:nd,por:null,porNome:"planilha"}; }
      else if(nd&&nd!==rfDiaDe(ex.rfInfo)) camp.rfInfo={...ex.rfInfo,dia:nd}; }
    const at=typeof ex.status==="number"?ex.status:1; let st=null;
    if(doWms&&sc!=null&&sc!==at&&sc>=1&&sc<=4){ P("w",l,`Status na base: ${ST[sc].nome}; no painel (WMS): ${ST[at].nome}. A produção é acompanhada pelo WMS.`); sc=null; }
    if(sc!=null&&sc!==at){ if(POS(sc)>POS(at)) st=sc; else atras.push({id,l,de:at,para:sc,baseHist:ex.hist||[]}); }
    if(st!=null||Object.keys(camp).length||histMudou) mud.push({id,l,camp,de:at,para:st,baseHist:ex.hist||[],histMudou,rfJa:!!(ex.rfInfo&&ex.rfInfo.em)}); else if(!(sc!=null&&sc!==at)) iguais.push(id);
  });
  const ids=new Set(seen.keys());
  const fora=[...docs.entries()].filter(([id,d])=>!ids.has(id)&&(typeof d.status==="number"?d.status:1)>=1&&(typeof d.status==="number"?d.status:1)<=5).map(([id,d])=>({id,d}));
  const foraTodos=[...docs.keys()].filter(id=>!ids.has(id));
  probs.sort((a,b)=>(a.sev===b.sev?a.linha-b.linha:a.sev==="e"?-1:1));
  return {arquivo,aba:lp.aba,probs,novas,mud,atras,iguais,fora,foraTodos,removerFora:modoLocal&&foraTodos.length>0,regras:diffRegras(lp.regras),aplicarRegras:canAdmin,aplicarAtras:modoLocal,em:hojeIso(),fase:"previa",feitos:0,total:0,erro:"",sujoAntes:modoLocal&&sujo&&docs.size>0};
}

async function mudarRegra(delta,campo){
  campo=campo||"regraDias"; const lim=campo==="rfDias"?[0,10]:[1,20];
  const novo=Math.max(lim[0],Math.min(lim[1],cfg[campo]+delta)); if(novo===cfg[campo]||salvandoRegra) return;
  const antes=cfg[campo]; salvandoRegra=true; render();
  try{ await db.doc("config/geral").set({...cfg,[campo]:novo,regraTerca:cfg.regraTerca,feriadosExtras:cfg.feriadosExtras||[],atualizadoEm:new Date().toISOString(),atualizadoPor:meId||null});
    salvandoRegra=false; marcarSujo(true);
    const oque=campo==="rfDias"?`Informar R.F. alterado de ${antes} para ${pl(novo,"dia útil","dias úteis")} antes do cronograma`:`Regra alterada de ${antes} para ${pl(novo,"dia útil","dias úteis")} antes da agenda`;
    setToast(`${oque}. As datas e os alertas foram recalculados${modoLocal?". Clique em Baixar base para levar a regra na planilha.":" para toda a equipe."}`); }
  catch(e){ salvandoRegra=false; setToast(erroTxt(e),true); }
}
async function salvarCfg(){
  const reg=parseInt($("#cfreg").value,10), at=parseInt($("#cfat").value,10), rfd=cfg.rfDias;
  const linhas=$("#cffer").value.split(/\n|;|,/).map(s=>s.trim()).filter(Boolean); const fer=[]; const bad=[];
  linhas.forEach(s=>{const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)fer.push(iso(+m[3],+m[2],+m[1]));else bad.push(s);});
  if(!(reg>=1&&reg<=20)||!(at>=0&&at<=10)||!(rfd>=0&&rfd<=10)||bad.length){$("#cfmsg").textContent=bad.length?"Data inválida: "+bad[0]:"Confira os números.";return;}
  try{ await db.doc("config/geral").set({regraDias:reg,rfDias:rfd,atencaoDias:at,regraTerca:!!($("#cfter")&&$("#cfter").checked),feriadosExtras:[...new Set(fer)].sort(),atualizadoEm:new Date().toISOString(),atualizadoPor:meId||null}); cfgOpen=false; renderCfg(); marcarSujo(true); setToast(modoLocal?"Regras salvas. Clique em Baixar base para levar as regras na planilha.":"Regras salvas para toda a equipe."); }
  catch(e){ $("#cfmsg").textContent=erroTxt(e); }
}

async function pedirNomes(ids,esperar){
  if(!userNs||typeof userNs.profiles!=="function") return;
  const falta=[...new Set(ids)].filter(id=>id&&!askedNames.has(id)); if(!falta.length) return;
  falta.forEach(id=>askedNames.add(id));
  const p=userNs.profiles(falta).then(ps=>{let mudou=false;Object.entries(ps||{}).forEach(([id,pr])=>{if(pr&&pr.name){names[id]=pr.name;mudou=true;}});if(mudou&&!esperar){render();}}).catch(()=>{});
  if(esperar) await p;
}

  if(t.id==="busca"){busca=t.value;clearTimeout(buscaT);buscaT=setTimeout(()=>{const pos=($("#busca")||{}).selectionStart;render();const b=$("#busca");if(b){b.focus();try{b.setSelectionRange(pos,pos);}catch(_){}}},180);}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(agM&&agM.fase!=="gravando"){agM=null;$("#modal").innerHTML="";}else if(pbM&&pbM.fase!=="gravando"){pbM=null;$("#modal").innerHTML="";}else if(imp&&imp.fase!=="gravando"){imp=null;$("#modal").innerHTML="";}else if(cfgOpen){cfgOpen=false;renderCfg();}else if($("#txtcopia")){$("#modal").innerHTML="";}else if(openId)fechar();else if(view()==="tv"){sairTV();}else if(document.querySelector("details.mais[open]")){document.querySelectorAll("details.mais[open]").forEach(d=>d.open=false);}else if(menuAberto){menuAberto=false;guardaMenu();document.body.classList.add("sem-anim");render();requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove("sem-anim")));const b=$("#menubtn");if(b)b.focus();}}});
function focoEnvio(env){const cal=document.querySelector(".cal,.mcal");if(!cal)return;
  document.querySelectorAll(".cc.hl").forEach(x=>x.classList.remove("hl"));
  if(!env){cal.classList.remove("foco");return;}
  const l=document.querySelectorAll('.cc.conj[data-env="'+(window.CSS&&CSS.escape?CSS.escape(env):env)+'"]'); if(!l.length){cal.classList.remove("foco");return;}
  l.forEach(x=>x.classList.add("hl")); cal.classList.add("foco");}
document.addEventListener("mouseover",e=>{const c=e.target.closest&&e.target.closest(".cc.conj,.cjitem");focoEnvio(c?c.dataset.env:null);});
document.addEventListener("focusin",e=>{const c=e.target.closest&&e.target.closest(".cc.conj");focoEnvio(c?c.dataset.env:null);});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

/* ================= tour de boas-vindas ================= */
let tourI=-1, tourPassos=[];
const TOUR=[
  ["#menubtn","Menu","Abra o menu para ver as telas: Resumo, Agendadas, Produção, Atrasadas e pendências, Calendário e as demais."],
  [".lojasel","Loja","Escolha a loja destino. O painel lembra a sua escolha."],
  ['#menu a[data-ir="resumo"]',"Resumo","Os números do dia e os próximos envios a expedir, com as cargas de cada um."],
  ['#menu a[data-ir="agendadas"]',"Cargas agendadas","As cargas com agenda no Mercado Livre, por dia, com a etapa de cada uma."],
  ['#menu a[data-ir="pendencias"]',"Atrasadas e pendências","Só o que precisa de ação, com as atrasadas primeiro."],
  ['#menu a[data-ir="indicadores"]',"Indicadores","Prazos, OTIF de expedição, motivos de atraso e o relatório do mês pronto para copiar."],
  ['#menu a[data-ir="tv"]',"Modo TV","Tela cheia para um monitor da operação: alterna Resumo e Agendadas a cada 30 segundos."],
  [".usu summary","Sua conta","Abra Meu perfil para ver seus dados e escolher o tema. Aqui também troca a senha e sai."],
  ['#menu a[data-ir="ajuda"]',"Ajuda","Tudo explicado por perfil. O tour pode ser revisto por lá."]];
const tourChave=()=>"painel-tour-v3-"+(meId||"local");
function tourTalvez(){ if(tourI>=0||retrato||!loaded||!docs.size||view()!=="inicio"||!lojaEscolhida||openId||imp) return; try{if(localStorage.getItem(tourChave()))return;}catch(_){return;} setTimeout(()=>{if(tourI<0&&view()==="inicio"){if(!menuAberto){menuAberto=true;render();}tourIniciar();}},700); }
function tourIniciar(){ if(!menuAberto){menuAberto=true;render();} tourPassos=TOUR.filter(([sel])=>document.querySelector(sel)); if(!tourPassos.length) return; tourI=0; tourDesenhar(); }
function tourFim(){ tourI=-1; const el=$("#tour"); if(el) el.remove(); try{localStorage.setItem(tourChave(),"1");}catch(_){} }
function tourDesenhar(){
  let el=$("#tour"); if(!el){el=document.createElement("div");el.id="tour";document.body.appendChild(el);}
  const [sel,tit,txt]=tourPassos[tourI]; const alvo=document.querySelector(sel); if(!alvo){tourFim();return;}
  alvo.scrollIntoView({block:"center",behavior:"instant"});
  const r=alvo.getBoundingClientRect(), pad=6, W=Math.min(340,innerWidth-24);
  const abaixo=r.bottom+180<innerHeight||r.top<200;
  const top=abaixo?Math.min(innerHeight-170,r.bottom+pad+10):Math.max(12,r.top-pad-10-160);
  const left=Math.max(12,Math.min(innerWidth-W-12,r.left));
  el.innerHTML=`<div class="tourhl" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
    <div class="tourbox" role="dialog" aria-modal="true" aria-label="Tour" style="top:${top}px;left:${left}px;width:${W}px"><span class="label">Passo ${tourI+1} de ${tourPassos.length}</span><h3>${tit}</h3><p>${txt}</p>
    <div class="mfoot"><button class="btn ghost sm" data-tour="sair">Pular</button>${tourI>0?`<button class="btn ghost sm" data-tour="-1">Voltar</button>`:""}<button class="btn sm" data-tour="1">${tourI===tourPassos.length-1?"Concluir":"Próximo"}</button></div></div>`;
  const b=el.querySelector('[data-tour="1"]'); if(b) b.focus();
}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-tour]"); if(t){const a=t.dataset.tour; if(a==="sair"){tourFim();return;} tourI+=Number(a); if(tourI>=tourPassos.length) tourFim(); else tourDesenhar(); return;}
  if(e.target.closest&&e.target.closest("#vertour")){try{localStorage.removeItem(tourChave());}catch(_){} location.hash="#painel"; setTimeout(tourIniciar,300);}},true);
window.addEventListener("resize",()=>{if(tourI>=0)tourDesenhar();});
document.addEventListener("keydown",e=>{if(tourI>=0&&e.key==="Escape"){e.stopPropagation();tourFim();}},true);

/* ================= ponte com as abas online ================= */
window.PAINEL_API={ST,cargas:()=>allRows,busca:()=>busca,rerender:()=>{if(!openId)render();else{render();}},toast:(t,e)=>setToast(t,e),cfg:()=>cfg,
  abrirRegras:()=>{cfgOpen=true;cfgDraft={regraDias:cfg.regraDias,rfDias:cfg.rfDias,atencaoDias:cfg.atencaoDias,regraTerca:cfg.regraTerca,fer:(cfg.feriadosExtras||[]).map(brA).join("\n")};renderCfg();}};

/* ================= inicialização ================= */
async function iniciar(){
  const re=document.getElementById("retrato");
  if(re){ try{ retrato=JSON.parse(re.textContent); }catch(_){ retrato=null; } }
  if(retrato){ docs=new Map(retrato.docs||[]); meta=retrato.meta||null; const c=retrato.cfg||{};
    cfg=normCfg(c);
    Object.assign(names,retrato.nomes||{}); ferCache={}; loaded=true; canWrite=false; canAdmin=false; readOnlyReason="Retrato somente leitura"; render(); return; }
  if(window.PAINEL_ONLINE){
    try{ online=await PAINEL_ONLINE.conectar(); db=online.db; userNs=online.user; }
    catch(e){ loaded=true; loadErr="Não foi possível abrir o painel online ("+((e&&e.message)||"erro")+"). Verifique a internet e recarregue a página."; render(); return; }
  }
  else if(window.claude&&claude.use){
    claude.use("downloads").then(d=>{downloadsNs=d;}).catch(()=>{});
    userNs=await claude.use("user").catch(()=>null);
    db=await claude.use("db").catch(()=>null);
  }
  if(!db){ modoLocal=true; userNs=null; db=storeLocal(); canWrite=true; canAdmin=true; try{sujo=localStorage.getItem(KEY_SUJO)==="1";}catch(_){} }
  if(userNs&&!modoLocal){ try{meId=await userNs.id();}catch(_){}
    try{const c=await userNs.can("data.write"); if(c===false){canWrite=false;readOnlyReason=online?"Você só visualiza. Para alterar, peça ao Administrador Master para liberar o seu acesso.":"Seu acesso a este painel é de leitura.";}}catch(_){}
    try{canAdmin=!!(await userNs.canEdit());}catch(_){} }
  const timer=setTimeout(()=>{slow=true;render();},10000);
  db.collection("cargas").onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{if(d.exists)m.set(d.id,d.data());});
    const sig=JSON.stringify([...m.entries()]); const eraLoaded=loaded;
    if(!snap.metadata||!snap.metadata.fromCache){loaded=true;slow=false;clearTimeout(timer);} else if(m.size) loaded=true;
    if(sig===lastSig&&eraLoaded===loaded) return; lastSig=sig; docs=m;
    render();
  },err=>{clearTimeout(timer);loadErr="A conexão com os dados foi interrompida. Recarregue a página.";render();});
  db.doc("meta/base").onSnapshot(s=>{const n=s.exists?s.data():null;const k=JSON.stringify(n);if(k===lastMeta)return;lastMeta=k;meta=n;render();},()=>{});
  db.doc("config/geral").onSnapshot(s=>{const c=s.exists?s.data():{};const k=JSON.stringify(c);if(k===lastCfg)return;lastCfg=k;cfg=normCfg(c);ferCache={};render();},()=>{});
}
render(); iniciar();
setInterval(()=>{ if(!openId&&!imp&&!cfgOpen) render(); }, 30*60*1000);
})();
</script>
